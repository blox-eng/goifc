name: Bug Report
description: Create a detailed bug report to help us improve goifc
title: 'issue: '
labels: ['bug', 'triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Bug Report

        ## Important Notes

        - **Before submitting a bug report**: Please check the [Issues](https://github.com/blox-eng/goifc/issues) or [Discussions](https://github.com/blox-eng/goifc/discussions) sections to see if a similar issue has already been reported. If unsure, start a discussion first, as this helps us efficiently focus on improving the project.

        - **Contributing**: If you encounter an issue, consider submitting a pull request or forking the project.

        - **Bug Reproducibility**: If a bug cannot be reproduced community assistance may be required.

  - type: checkboxes
    id: issue-check
    attributes:
      label: Check Existing Issues
      description: Confirm that you’ve checked for existing reports before submitting a new one.
      options:
        - label: I have searched the existing issues and discussions.
          required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe how it should've been
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe how it actually was
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The goifc module version (or commit SHA) and your `go version` output.
      placeholder: |
        goifc v0.3.1 (or commit 1a2b3c4)
        go version go1.25.4 linux/amd64
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Providing clear, step-by-step instructions helps us reproduce and fix the issue faster. If we can't reproduce it, we can't fix it.
      placeholder: |
        1. f, _ := step.ParseFile("example.ifc")
        2. a, _ := ifc.Assemble(f)
        3. Element "W-104" (a.Result.Elements[i]) reports QuantitySource "none"
           where I expected "qto", and Qto.Volume is nil
        4. (or) ifc.Assemble panics on this file — see stack trace below
    validations:
      required: true

  - type: textarea
    id: logs-output
    attributes:
      label: Logs & Stack Trace
      description: Include the full panic stack trace, relevant `go test` output, and/or a minimal IFC file or code snippet that reproduces the issue.
      placeholder: 'Paste the panic stack trace or go test -v output here, or attach a minimal .ifc file that reproduces the issue.'
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Provide any extra details that may assist in understanding the issue.
    validations:
      required: false
