name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed
  # Attaches the wasm files to an existing tag, when the wasm-assets job
  # failed after the release was cut.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the wasm files to, e.g. v0.19.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # go-semantic-release/action (SHA-pinned below) is a thin wrapper: at
  # runtime it downloads a `semantic-release` executable and runs it with
  # this job's `contents: write` permission. Pinning the action's SHA does
  # NOT pin that executable — by default the action fetches whatever is
  # currently "latest" from registry.go-semantic-release.xyz. We instead
  # download a specific, checksummed release ourselves and hand the action
  # that binary via its `bin` input, so nothing here floats.
  #
  # To bump: pick the new tag from
  # https://github.com/go-semantic-release/semantic-release/releases, then
  # copy the `linux_amd64` line out of that release's own
  # `semantic-release_<version>_checksums.txt` asset.
  SEMREL_VERSION: v2.31.0
  SEMREL_SHA256: b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3

jobs:
  release:
    name: Create Release
    # Only CI on a push to this repository's main: the branches filter above
    # also matches a pull request from a fork's branch named main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch and verify semantic-release binary
        id: semrel-bin
        run: |
          set -euo pipefail
          asset="semantic-release_${SEMREL_VERSION}_linux_amd64"
          url="https://github.com/go-semantic-release/semantic-release/releases/download/${SEMREL_VERSION}/${asset}"
          dest="${RUNNER_TEMP}/${asset}"

          curl --fail --silent --show-error --location -o "$dest" "$url"

          echo "${SEMREL_SHA256}  ${dest}" | sha256sum -c -

          chmod +x "$dest"
          echo "path=${dest}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          hooks: goreleaser
          # Throwaway path for the goreleaser hook — never committed. The
          # real CHANGELOG.md is promoted by hand below, since `prepend`
          # writes above the file's H1 and intro prose, and this action
          # never commits the file back to the repo regardless.
          changelog-file: .release-notes.md
          allow-initial-development-versions: true
          prepend: true
          bin: ${{ steps.semrel-bin.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the changelog section as the release notes
        # The generated notes are one line per squash-merge title. The
        # Unreleased section of CHANGELOG.md is the hand-written record of this
        # release. This workflow commits nothing: the next PR renames the
        # section: the Promote Changelog job below opens that PR, and CI's
        # changelog guard fails every other PR until it merges (#140). The
        # release already exists, so a problem with its notes warns rather than
        # failing the job.
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${RELEASE_VERSION}"
          if ! notes="$(.github/scripts/release-notes.sh Unreleased)" || [[ -z "$notes" ]]; then
            echo "::warning::CHANGELOG.md has no Unreleased entries; ${tag} keeps its generated notes."
            exit 0
          fi

          # The release action created the new tag on the remote after checkout.
          if ! git fetch --tags --quiet; then
            echo "::warning::Could not fetch tags; ${tag} keeps its generated notes."
            exit 0
          fi
          if prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${tag}^" 2>/dev/null)"; then
            # A PR that merged before the previous release was promoted leaves
            # that release's entries under Unreleased too. Publishing them
            # would repeat its notes.
            if ! .github/scripts/changelog-guard.sh "$prev" CHANGELOG.md >/dev/null 2>&1; then
              echo "::warning::CHANGELOG.md has no heading for ${prev}, so Unreleased holds more than ${tag}; ${tag} keeps its generated notes. Fix the notes by hand."
              exit 0
            fi
            notes+=$'\n\n'"**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          fi

          printf '%s\n' "$notes" > "${RUNNER_TEMP}/release-notes.md"
          gh release edit "$tag" --notes-file "${RUNNER_TEMP}/release-notes.md" \
            || echo "::warning::Could not set ${tag}'s notes from CHANGELOG.md."

  # Builds goifc-build.wasm and goifc-read.wasm from the tag and attaches them
  # to its release with SHA256SUMS and signed build provenance, so anyone can
  # check the files came from this workflow at that tag:
  #   gh attestation verify goifc-build.wasm --repo blox-eng/goifc
  # The tag and release already exist when this runs. If it fails, the
  # release has no wasm files until this workflow runs by hand with the tag.
  wasm-assets:
    name: Attach WebAssembly Files
    needs: release
    if: >-
      always() &&
      ((needs.release.result == 'success' && needs.release.outputs.version != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Choose the tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="${DISPATCH_TAG:-v${RELEASE_VERSION}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${tag}' is not a release tag like v1.2.3."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      # The provenance names the commit this run started from (github.sha),
      # so the tag must point there. A retry runs from the tag itself:
      # gh workflow run release.yml --ref v1.2.3 -f tag=v1.2.3
      - name: Check the tag is the commit this run attests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_SHA: ${{ github.sha }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$RUN_SHA" ]]; then
            echo "::error::${TAG} is ${tag_sha}, but this run is from ${RUN_SHA}, so its provenance would name the wrong commit. Run it from the tag: gh workflow run release.yml --ref ${TAG} -f tag=${TAG}"
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the wasm files
        run: |
          make wasm
          .github/scripts/wasm-deps.sh
          .github/scripts/wasm-size.sh dist/goifc-build.wasm
          .github/scripts/wasm-size.sh dist/goifc-read.wasm
      - name: Check the files answer with the tag's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          got="$(node wasm/test/version.mjs)"
          if [[ "$got" != "$TAG" ]]; then
            echo "::error::goifc-build.wasm answers goifcVersion '${got}', want '${TAG}'."
            exit 1
          fi
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum goifc-build.wasm goifc-read.wasm wasm_exec.js goifc.js goifc-contract.schema.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/goifc-build.wasm
            dist/goifc-read.wasm
            dist/wasm_exec.js
            dist/goifc.js
            dist/goifc-contract.schema.json
            dist/SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/goifc-build.wasm dist/goifc-read.wasm dist/wasm_exec.js \
            dist/goifc.js dist/goifc-contract.schema.json dist/SHA256SUMS

  # Promotes CHANGELOG.md's Unreleased section to the release and points the
  # goifc.org news line at it, in a pull request that merges itself once its
  # checks pass. RELEASE_TOKEN opens it: a pull request opened with the
  # built-in token starts no CI and never merges (#140). This job's own token
  # only reads. If it fails, `make promote` does the same by hand
  # (CONTRIBUTING.md, After a release). While it waits it holds the release
  # concurrency group; a later Release run queues, which is harmless.
  promote:
    name: Promote Changelog
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      # main, not the tag: the tag's CHANGELOG.md is never promoted, and a
      # promotion that already merged shows only on main. The tags come too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: .github/scripts/open-promote-pr.sh "$VERSION"
      # main takes only up-to-date branches, and auto-merge never updates
      # one. When main moves, the branch is built again from it rather than
      # merged with it: a merge could file an entry added after the tag under
      # this release, which promote-release.sh refuses to do.
      - name: Keep the pull request up to date until it merges
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          branch="docs/promote-v${VERSION}"
          for _ in $(seq 1 40); do
            state="$(gh pr view "$branch" --json state,mergeStateStatus -q '.state + " " + .mergeStateStatus')" ||
              { echo "no pull request for $branch: nothing to wait for"; exit 0; }
            case "$state" in
              MERGED*) echo "merged"; exit 0 ;;
              CLOSED*) echo "::warning::the v${VERSION} promotion pull request was closed: run make promote (CONTRIBUTING.md, After a release)"; exit 0 ;;
              *BEHIND | *DIRTY)
                git fetch -q origin main
                git switch -q --detach FETCH_HEAD
                .github/scripts/open-promote-pr.sh "$VERSION" ;;
            esac
            sleep 60
          done
          echo "::warning::the v${VERSION} promotion pull request has not merged in 40 min: look at its checks, or run make promote (CONTRIBUTING.md, After a release)"
