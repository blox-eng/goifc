name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed
  # Attaches the wasm files to an existing tag, when the wasm-assets job
  # failed after the release was cut.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the wasm files to, e.g. v0.19.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # go-semantic-release/action (SHA-pinned below) is a thin wrapper: at
  # runtime it downloads a `semantic-release` executable and runs it with
  # this job's `contents: write` permission. Pinning the action's SHA does
  # NOT pin that executable — by default the action fetches whatever is
  # currently "latest" from registry.go-semantic-release.xyz. We instead
  # download a specific, checksummed release ourselves and hand the action
  # that binary via its `bin` input, so nothing here floats.
  #
  # To bump: pick the new tag from
  # https://github.com/go-semantic-release/semantic-release/releases, then
  # copy the `linux_amd64` line out of that release's own
  # `semantic-release_<version>_checksums.txt` asset.
  SEMREL_VERSION: v2.31.0
  SEMREL_SHA256: b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3

jobs:
  release:
    name: Create Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      # The changelog promote opens a PR instead of pushing to main, which the
      # branch ruleset forbids.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch and verify semantic-release binary
        id: semrel-bin
        run: |
          set -euo pipefail
          asset="semantic-release_${SEMREL_VERSION}_linux_amd64"
          url="https://github.com/go-semantic-release/semantic-release/releases/download/${SEMREL_VERSION}/${asset}"
          dest="${RUNNER_TEMP}/${asset}"

          curl --fail --silent --show-error --location -o "$dest" "$url"

          echo "${SEMREL_SHA256}  ${dest}" | sha256sum -c -

          chmod +x "$dest"
          echo "path=${dest}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          hooks: goreleaser
          # Throwaway path for the goreleaser hook — never committed. The
          # real CHANGELOG.md is promoted by hand below, since `prepend`
          # writes above the file's H1 and intro prose, and this action
          # never commits the file back to the repo regardless.
          changelog-file: .release-notes.md
          allow-initial-development-versions: true
          prepend: true
          bin: ${{ steps.semrel-bin.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the changelog section as the release notes
        # The generated notes are one line per squash-merge title. The
        # Unreleased section of CHANGELOG.md is the hand-written record of this
        # release, read here before the promote step below renames it. The
        # release already exists, so a problem with its notes warns rather than
        # failing the job.
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${RELEASE_VERSION}"
          if ! notes="$(.github/scripts/release-notes.sh Unreleased)" || [[ -z "$notes" ]]; then
            echo "::warning::CHANGELOG.md has no Unreleased entries; ${tag} keeps its generated notes."
            exit 0
          fi

          # The release action created the new tag on the remote after checkout.
          if ! git fetch --tags --quiet; then
            echo "::warning::Could not fetch tags; ${tag} keeps its generated notes."
            exit 0
          fi
          if prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null)"; then
            notes+=$'\n\n'"**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          fi

          printf '%s\n' "$notes" > "${RUNNER_TEMP}/release-notes.md"
          gh release edit "$tag" --notes-file "${RUNNER_TEMP}/release-notes.md" \
            || echo "::warning::Could not set ${tag}'s notes from CHANGELOG.md."
      - name: Promote Unreleased changelog section
        # steps.release.outputs.version is only set when a new version was
        # actually released (go-semantic-release/action returns early,
        # without calling setOutput, when there's nothing to release).
        #
        # This opens a PR rather than pushing to main. The main ruleset requires
        # a pull request and 5 status checks with no bypass actors, so the direct
        # push this used to do was rejected outright (GH013) — the tag and the
        # GitHub Release were created and only the changelog commit was lost, so
        # the job failed AFTER releasing and the drift was silent. Granting the
        # bot a bypass would have fixed it by letting every workflow in the repo
        # push to main unreviewed, which is a poor trade for a docs commit.
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date="$(date -u +%Y-%m-%d)"
          .github/scripts/promote-changelog.sh "$RELEASE_VERSION" "$date"

          # goifc.org's news line names the release. A release with no
          # headline in its changelog section (most patch releases) keeps the
          # line of the last one that had one, and the pull request says so.
          news=""
          if ! .github/scripts/announce-release.sh "$RELEASE_VERSION"; then
            news="**goifc.org keeps announcing the last release with a headline:** v${RELEASE_VERSION} has no \`- **...**\` line in CHANGELOG.md. To announce it, add one, run \`.github/scripts/announce-release.sh ${RELEASE_VERSION}\` on this branch, and push."
          fi

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to promote."
            exit 0
          fi

          branch="chore/changelog-v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md www/index.html
          git commit -m "docs: promote Unreleased to v${RELEASE_VERSION} in CHANGELOG.md"
          git push origin "$branch"

          # --fill would reuse the commit message; the body is worth spelling
          # out because whoever sees this PR did not run the release. Built with
          # printf so the text is not indented by this block's YAML indentation.
          body="$(printf '%s\n' \
            "Automated by the Release workflow after cutting v${RELEASE_VERSION}." \
            "" \
            "Moves the \`## Unreleased\` section under a \`## v${RELEASE_VERSION}\` heading." \
            "The tag and GitHub Release already exist; this only records them in" \
            "the changelog, so merging is safe whenever convenient." \
            "" \
            "$news")"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: promote Unreleased to v${RELEASE_VERSION} in CHANGELOG.md" \
            --body "$body"

          # Auto-merge so the changelog does not drift while PRs queue up. It
          # merges once the required checks pass; if auto-merge is disabled on
          # the repo, say so and leave the PR open rather than failing a release
          # that has already succeeded.
          gh pr merge "$branch" --squash --auto \
            || echo "::warning::Could not enable auto-merge; merge the changelog PR by hand."

  # Builds goifc-build.wasm and goifc-read.wasm from the tag and attaches them
  # to its release with SHA256SUMS and signed build provenance, so anyone can
  # check the files came from this workflow at that tag:
  #   gh attestation verify goifc-build.wasm --repo blox-eng/goifc
  # The tag and release already exist when this runs. If it fails, the
  # release has no wasm files until this workflow runs by hand with the tag.
  wasm-assets:
    name: Attach WebAssembly Files
    needs: release
    if: >-
      always() &&
      ((needs.release.result == 'success' && needs.release.outputs.version != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Choose the tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="${DISPATCH_TAG:-v${RELEASE_VERSION}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${tag}' is not a release tag like v1.2.3."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the wasm files
        run: |
          make wasm
          .github/scripts/wasm-size.sh dist/goifc-build.wasm 1200000 dist/goifc-read.wasm
      - name: Check the files answer with the tag's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          got="$(node wasm/test/version.mjs)"
          if [[ "$got" != "$TAG" ]]; then
            echo "::error::goifc-build.wasm answers goifcVersion '${got}', want '${TAG}'."
            exit 1
          fi
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum goifc-build.wasm goifc-read.wasm wasm_exec.js goifc.js goifc-contract.schema.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/goifc-build.wasm
            dist/goifc-read.wasm
            dist/wasm_exec.js
            dist/goifc.js
            dist/goifc-contract.schema.json
            dist/SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/goifc-build.wasm dist/goifc-read.wasm dist/wasm_exec.js \
            dist/goifc.js dist/goifc-contract.schema.json dist/SHA256SUMS
