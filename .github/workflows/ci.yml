name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow. The repository default is read/WRITE,
# which every job here would otherwise inherit for no reason — CI only reads the
# tree. A job that genuinely needs more asks for it explicitly (see release.yml,
# which scopes contents: write to the one job that publishes).
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
     - name: Conventional Commits
       uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
       with:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         allowed-commit-types: "feat,fix,cicd,chore,patch,release,test,docs,refactor,ci,dev"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: conventional-commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true
        env:
          GOPROXY: https://proxy.golang.org,direct

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run tests
        # goifc is pure Go with no cgo dependencies. Pinning CGO_ENABLED=0
        # asserts that property in CI: if a dependency ever sneaks in a cgo
        # requirement, the build fails loudly here instead of silently
        # linking against system libraries.
        env:
          CGO_ENABLED: '0'
        run: go test -v -cover ./...

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: conventional-commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # govulncheck is the complement to Dependabot, not a duplicate: Dependabot
      # tells you a newer version exists, govulncheck tells you whether a known
      # vulnerability is actually REACHABLE from this code — and it covers the
      # Go standard library, which a dependency bump never touches. The pinned
      # toolchain is exactly the kind of thing this catches — and did, on the first
      # run: GO-2026-4601 (net/url IPv6 parsing) was reachable from WriteGLB via
      # gltf.Encoder.Encode on the then-pinned 1.25.4, fixed in 1.25.8.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.25.12'
          go-package: ./...

  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: true
      # goifc parses files supplied by third parties, and its recursion guards
      # (maxMapDepth, maxWalkDepth, maxApproxLadder) are hand-reasoned defences
      # whose own comments describe the failure as a stack overflow that
      # recover() cannot catch. A short per-PR run will not prove they hold, but
      # it does stop a REGRESSION that reopens a crash the corpus already knows
      # about, since the seed corpus and any committed testdata/fuzz/ crashers
      # replay every run.
      - name: Fuzz the STEP parser
        env:
          CGO_ENABLED: '0'
        run: go test ./step/ -run FuzzParseBytes -fuzz FuzzParseBytes -fuzztime=60s
      - name: Fuzz the full assemble path
        env:
          CGO_ENABLED: '0'
        run: go test . -run FuzzAssemble -fuzz FuzzAssemble -fuzztime=60s
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
